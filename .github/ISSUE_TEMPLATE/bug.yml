name: Alpha bug report
description: Report a reproducible Orqestra alpha problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, account details, private source, and full Codex logs before submitting.
  - type: input
    id: version
    attributes:
      label: Orqestra version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and Codex CLI version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the command and smallest safe steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual and expected result
    validations:
      required: true
