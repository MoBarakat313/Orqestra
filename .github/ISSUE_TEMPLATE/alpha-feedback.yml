name: Public alpha feedback
description: Share an Orqestra installation or routing test result.
title: "[Alpha feedback]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for testing Orqestra. Remove credentials, account details, private source, and full Codex logs before submitting.
  - type: input
    id: version
    attributes:
      label: Orqestra version
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Node.js version, and Codex CLI version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What did you test?
      options:
        - Quick installation
        - Diagnostics or model discovery
        - Route preview
        - Single-worker execution
        - Coordinated execution
        - Recovery or resume
        - Usage or benchmark reporting
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Sanitized task and repository shape
      description: Describe the task, relevant package boundaries, and the prompt or command without sharing private source.
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Route and expectation
      description: Which route did Orqestra select, and did it match what you expected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Result and clarity
      description: What worked, what failed, and which installation, diagnostic, verification, or recovery message could be clearer?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: I removed credentials, account details, private source, and full Codex logs.
          required: true
