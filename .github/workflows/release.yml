name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release version
        run: node -e "const p=require('./package.json'); if ('v'+p.version!==process.env.GITHUB_REF_NAME) { console.error('Tag and package version differ'); process.exit(1) }"
      - name: Build release archive and checksum
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS.txt --verify-tag --prerelease --title "Orqestra $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
